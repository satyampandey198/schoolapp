name: schoolapp
description: "EduManage Pro — A professional School Management App with MVVM Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management & Navigation
  provider: ^6.1.2
  go_router: ^14.2.7

  # Charts & Indicators
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3

  # Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Storage & Utils
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  cached_network_image: ^3.3.1

  # Firebase (options file present; UI-only mode — no active calls)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.3

  # Export & Share
  excel: ^4.0.0
  pdf: ^3.11.1
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  open_filex: ^4.4.0

  # Connectivity & Offline
  connectivity_plus: ^6.0.5
  flutter_offline: ^5.0.0
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
