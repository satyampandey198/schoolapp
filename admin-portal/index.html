<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduManage Pro — Admin Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
</head>
<body class="login-page">

  <!-- Theme Toggle (top-right) -->
  <button class="login-theme-toggle theme-toggle-btn" onclick="handleToggle()" title="Toggle Theme">
    <span class="theme-icon-light" style="display:none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </span>
    <span class="theme-icon-dark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </span>
  </button>

  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🎓</div>
      <div>
        <h1>EduManage Pro</h1>
        <p>School Management System</p>
      </div>
    </div>

    <h2>Admin Sign In</h2>
    <p class="subtitle">Sign in to access the school administration portal</p>

    <!-- 🔐 Admin Credentials Box -->
    <div class="creds-box">
      <div class="creds-title">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Admin Login Credentials
      </div>
      <div class="cred-row">
        <span class="cred-label">Email</span>
        <span class="cred-value" onclick="fillEmail()" title="Click to fill">
          admin@edumanage.com
          <span class="copy-hint">↗ fill</span>
        </span>
      </div>
      <div class="cred-row" style="border-bottom:none;">
        <span class="cred-label">Password</span>
        <span class="cred-value" onclick="fillPassword()" title="Click to fill">
          Admin@123#
          <span class="copy-hint">↗ fill</span>
        </span>
      </div>
    </div>

    <div class="error-box" id="error-box">
      <span id="error-text"></span>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <div class="icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,12 2,6"/>
          </svg>
        </div>
        <input type="email" id="email" placeholder="admin@edumanage.com" autocomplete="email" />
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <div class="icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
    </div>

    <button class="btn btn-primary" id="login-btn">
      Sign In to Portal
    </button>

    <p style="text-align:center; margin-top:20px; font-size:12px; color:var(--text-muted);">
      🔒 Secured by Firebase Authentication
    </p>
    <p style="text-align:center; margin-top:8px; font-size:11px; color:var(--text-muted);">
      ⚠️ First time? Create the admin account in <a href="https://console.firebase.google.com" target="_blank" style="color:var(--primary);font-weight:600;">Firebase Console</a>
    </p>
  </div>

  <script type="module">
    import { loginWithEmail, redirectIfLoggedIn } from './js/auth.js';
    import { setLoading } from './js/app.js';
    import { initTheme, applyTheme } from './js/theme.js';

    // Initialize theme
    initTheme();
    redirectIfLoggedIn();

    // Theme toggle
    window.handleToggle = function () {
      const current = localStorage.getItem('edumanage_theme') || 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    };

    // Click to fill credentials
    window.fillEmail = function () {
      document.getElementById('email').value = 'admin@edumanage.com';
    };
    window.fillPassword = function () {
      document.getElementById('password').value = 'Admin@123#';
    };

    // Login
    const btn = document.getElementById('login-btn');
    btn.addEventListener('click', handleLogin);
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('error-box');
      const errorText = document.getElementById('error-text');

      errorBox.classList.remove('show');

      if (!email || !password) {
        errorText.textContent = 'Please enter your email and password.';
        errorBox.classList.add('show');
        return;
      }

      setLoading(btn, true, 'Signing in...');
      try {
        await loginWithEmail(email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        let msg = 'Invalid credentials. Please try again.';
        if (err.code === 'auth/user-not-found') msg = 'No account found. Create it in Firebase Console.';
        if (err.code === 'auth/wrong-password') msg = 'Incorrect password. Check credentials above.';
        if (err.code === 'auth/invalid-email') msg = 'Invalid email address.';
        if (err.code === 'auth/too-many-requests') msg = 'Too many attempts. Please wait a moment.';
        if (err.code === 'auth/invalid-credential') msg = 'Wrong email or password. Use credentials shown above.';
        errorText.textContent = msg;
        errorBox.classList.add('show');
      } finally {
        setLoading(btn, false);
      }
    }
  </script>
</body>
</html>
