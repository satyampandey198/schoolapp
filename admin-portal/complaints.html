<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complaints — EduManage Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-layout">
  <aside class="sidebar"></aside>

  <div class="main-area">
    <header class="topbar"><h1>Complaints Manager</h1>
      <div id="topbar-right">
        <select class="form-input" id="status-filter" onchange="filterComplaints()" style="width:150px;padding:9px 12px;">
          <option value="">All Status</option>
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>
    </header>
    <main class="page-content">
      <div class="card">
        <div class="card-header"><h2>All Complaints <span id="complaint-count" style="font-size:12px;color:var(--text-muted);"></span></h2></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>From</th><th>Subject</th><th>Category</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="complaints-tbody"><tr><td colspan="6"><div class="empty-state"><p>Loading...</p></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- View/Reply Modal -->
<div class="modal-overlay" id="complaint-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Complaint Details</h3>
      <button class="btn-ghost" onclick="document.getElementById('complaint-modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <div style="background:var(--surface2);border-radius:10px;padding:16px;margin-bottom:16px;">
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">Complaint from <strong id="c-from"></strong></p>
        <p style="font-weight:700;font-size:15px;margin-bottom:8px;" id="c-subject"></p>
        <p style="font-size:13px;color:var(--text-dim);" id="c-desc"></p>
      </div>
      <div class="form-group">
        <label>Update Status</label>
        <select class="form-input" id="c-status">
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>
      <div class="form-group">
        <label>Admin Response</label>
        <textarea class="form-input" id="c-response" rows="3" placeholder="Write your response..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-sm btn-outline" onclick="document.getElementById('complaint-modal').classList.remove('open')">Close</button>
      <button class="btn btn-sm btn-success" style="width:auto;padding:9px 22px;" id="update-btn" onclick="updateComplaint()">Update & Respond</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth } from './js/auth.js';
  import { injectSidebar, injectTopbarToggle } from './js/layout.js';
  import { db } from './js/firebase-config.js';
  import { showToast, setLoading, formatDate } from './js/app.js';
  import { collection, getDocs, updateDoc, doc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

  let allComplaints = [];
  let currentId = null;

  requireAuth(async (user) => {
    injectSidebar(user.email);
    injectTopbarToggle();
    await loadComplaints();
  });

  async function loadComplaints() {
    const snap = await getDocs(query(collection(db, 'complaints'), orderBy('createdAt', 'desc')));
    allComplaints = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById('complaint-count').textContent = `(${allComplaints.length})`;
    renderTable(allComplaints);
  }

  const statusBadge = { open: 'badge-danger', in_progress: 'badge-warning', resolved: 'badge-success' };

  function renderTable(complaints) {
    const tbody = document.getElementById('complaints-tbody');
    if (!complaints.length) { tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>No complaints found.</p></div></td></tr>'; return; }
    tbody.innerHTML = complaints.map(c => `
      <tr>
        <td style="font-weight:600;">${c.submittedBy || c.studentName || '—'}</td>
        <td>${c.subject || c.title || '—'}</td>
        <td><span class="badge badge-purple">${c.category || 'General'}</span></td>
        <td><span class="badge ${statusBadge[c.status] || 'badge-gray'}">${c.status?.replace('_', ' ') || 'open'}</span></td>
        <td>${formatDate(c.createdAt)}</td>
        <td><button class="btn btn-sm btn-info" onclick="viewComplaint('${c.id}')">View & Reply</button></td>
      </tr>`).join('');
  }

  window.filterComplaints = () => {
    const status = document.getElementById('status-filter').value;
    renderTable(status ? allComplaints.filter(c => c.status === status) : allComplaints);
  };

  window.viewComplaint = (id) => {
    const c = allComplaints.find(x => x.id === id);
    if (!c) return;
    currentId = id;
    document.getElementById('c-from').textContent = c.submittedBy || c.studentName || 'Unknown';
    document.getElementById('c-subject').textContent = c.subject || c.title || '—';
    document.getElementById('c-desc').textContent = c.description || c.message || 'No description provided.';
    document.getElementById('c-status').value = c.status || 'open';
    document.getElementById('c-response').value = c.adminResponse || '';
    document.getElementById('complaint-modal').classList.add('open');
  };

  window.updateComplaint = async () => {
    if (!currentId) return;
    const btn = document.getElementById('update-btn');
    setLoading(btn, true);
    try {
      await updateDoc(doc(db, 'complaints', currentId), {
        status: document.getElementById('c-status').value,
        adminResponse: document.getElementById('c-response').value.trim(),
      });
      showToast('Complaint updated!', 'success');
      document.getElementById('complaint-modal').classList.remove('open');
      await loadComplaints();
    } catch (e) { showToast('Error: ' + e.message, 'error'); } finally { setLoading(btn, false); }
  };
</script>
</body>
</html>
